{% extends 'myproject/base.html' %}

{% block content %}
    <h2>{{ place.name }}</h2>
    <img src="https://images.unsplash.com/photo-1514933651103-005eec06c04b?auto=format&fit=crop&w=800&q=80" alt="Cover" style="border-radius: 4px; margin-bottom: 15px;">
    <p><strong>Rating:</strong> <span class="star-rating">{{ place.get_rating }}</span></p>
    <p><strong>Address:</strong> {{ place.address|default:"Secret place👀" }}</p>
    <p><strong>Type:</strong> {{ place.place_type }}</p>
    
    <blockquote>
        {{ place.description }}
    </blockquote>
    
    <p><small>Added on: {{ place.created_at|date:"Y-m-d" }}</small></p>
{% endblock %}
